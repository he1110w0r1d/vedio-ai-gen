# ====================================================================
# API Asset Studio - docker-compose (生产模式参考)
# ====================================================================
#
# 使用方式：
#   1. 复制为 docker-compose.yml
#   2. 根据实际情况修改环境变量
#   3. docker compose up -d
#
# 注意：
#   - APP_ENCRYPTION_KEY 必须替换为至少 32 字节的随机值
#   - 不要在此文件中写入真实 API Key
#   - Provider API Key 通过应用内「供应商」页面添加
# ====================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-ai-gen
    ports:
      - "${PORT:-8787}:8787"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8787}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Storage mode: local | object-public | object-private-presigned
      - STORAGE_MODE=${STORAGE_MODE:-local}
      # 以下仅在 STORAGE_MODE != local 时需要
      - OBJECT_STORAGE_ENDPOINT=${OBJECT_STORAGE_ENDPOINT:-}
      - OBJECT_STORAGE_BUCKET=${OBJECT_STORAGE_BUCKET:-}
      - OBJECT_STORAGE_REGION=${OBJECT_STORAGE_REGION:-}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY:-}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY:-}
    volumes:
      # 数据目录（db.json）
      - ./data:/app/data
      # 本地存储目录（LOCAL mode 下的资产生成文件）
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ====================================================================
  # MinIO (可选) - 本地预发对象存储演示
  # ====================================================================
  # 取消下方注释以启用 MinIO：
  #
  # minio:
  #   image: minio/minio:latest
  #   container_name: video-ai-gen-minio
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   volumes:
  #     - ./minio-data:/data
  #   command: server /data --console-address ":9001"
  #   restart: unless-stopped
  #
  # 启用 MinIO 后，在 Storage 配置中设置：
  #   STORAGE_MODE=object-private-presigned
  #   OBJECT_STORAGE_ENDPOINT=http://minio:9000
  #   OBJECT_STORAGE_BUCKET=video-ai-gen-assets
  #   OBJECT_STORAGE_REGION=us-east-1
  #   OBJECT_STORAGE_ACCESS_KEY=minioadmin
  #   OBJECT_STORAGE_SECRET_KEY=minioadmin
